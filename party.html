<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>⚔️ 人生支線 — 冒險小隊邀請</title>
<style>
body{background:#14102B;color:#EFE9D9;font-family:-apple-system,"PingFang HK",sans-serif;
display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:90vh;
text-align:center;padding:24px;line-height:1.6}
h1{color:#FFB938;font-size:1.6em;margin:0 0 8px}
p{color:#A79FCE;margin:6px 0}
.code{font-size:1.4em;letter-spacing:3px;color:#EFE9D9;background:#241E44;border:3px solid #000;

<h1>⚔️ 你班friend喺度等緊你</h1>
<p>有人邀請你加入佢哋嘅冒險小隊。</p>
<div class="code" id="codeBox"></div>
<a class="btn" id="openBtn" href="#">入 隊</a>
<p class="hint">未裝App？喺 App Store 搜尋「<b style="color:#FFB938">人生支線</b>」，
裝完再撳一次條link，或者入App用邀請碼入隊。</p>
<script>
var c = (new URLSearchParams(location.search).get("c") || "").toUpperCase();
var deep = "sidequest://party/" + encodeURIComponent(c);
document.getElementById("openBtn").href = deep;
document.getElementById("codeBox").textContent = c || "——";
if (c) { setTimeout(function () { location.href = deep; }, 400); }
</script>
